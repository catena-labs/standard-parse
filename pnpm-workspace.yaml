packages:
  - packages/*

catalog:
  arktype: ^2.2.0
  tsdown: ^0.22.3
  typescript: ^6
  valibot: ^1.4.2
  vitest: ^5.0.0
  zod: ^4.0.0
  zod-v3: npm:zod@^3.25.76

# https://pnpm.io/settings#allowbuilds
allowBuilds:
  esbuild: true
  unrs-resolver: true

# https://pnpm.io/settings#blockexoticsubdeps
blockExoticSubdeps: true

# Pin exact versions on install. No caret ranges.
saveExact: true

# https://pnpm.io/settings#trustpolicy
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080

# https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 1440

# https://pnpm.io/settings#overrides
overrides:
  # GHSA-fx2h-pf6j-xcff: vite server.fs.deny bypass on Windows, patched in 8.0.16. vitest 5 resolves vite as an auto-installed peer, so pnpm update does not lift it.
  "vite@>=8.0.0 <8.0.16": "8.2.2"
